<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <link rel="stylesheet" href="wing-file/CSS/style3.css">
    <script src="https://kit.fontawesome.com/8c2b73c7be.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">
                <h1>Oi, Rafaela</h1>
                <p>Como você está hoje?</p>
            </div>
            <i class="fa-regular fa-bell" id="bell"></i>
            <img src="wing-file/images/icone.png" alt="Icone de perfil" id="profile">
        </header>

        <main>
            <div class="emotions">
                <div class="great">
                    <i class="fa-solid fa-face-laugh-beam" id="great"></i>
                </div>
                 
                <div class="happy">
                    <i class="fa-solid fa-face-smile" id="happy"></i>
                </div>

                <div class="neutral">
                    <i class="fa-solid fa-face-meh" id="neutral"></i>
                </div>

                <div class="tired">
                    <i class="fa-solid fa-face-tired" id="tired"></i>
                </div>

                <div class="sad">
                    <i class="fa-solid fa-face-frown" id="sad"></i>
                </div>
            </div>

            <div class="subtitles">
                    <p>Ótimo</p>
                    <p>Feliz</p>
                    <p>Neutro</p>
                    <p>Cansada</p>
                    <p>Triste</p>
            </div>

            <div class="messenger">
                <i class="fa-solid fa-heart" id="heart"></i>
                <div class="lembrete">
                    <h2>Lembrete do dia</h2>
                    <p>Você já fez o seu momento de pausa hoje? Respire, você consegue.</p>
                </div>
                <i class="fa-solid fa-circle-notch" id="circle"></i>
            </div>

            <div class="recent">
                <div class="column-one">
                    <h3>Acesso rápido</h3>
                    <div class="calendar">
                        <i class="fa-regular fa-calendar-days" id="calendar"></i>
                        <h4>Agendar consulta</h4>
                    </div>
                    <a href="consulta.html" id="consulta">
                        <div class="atendimentos">
                            <i class="fa-solid fa-phone" id="peaple"></i>
                            <h4>Meus atendimentos</h4>
                        </div>
                    </a>
                </div>

                <div class="column-two">
                    <div class="rotina">
                        <i class="fa-solid fa-seedling" id="plant"></i>
                        <h4>Rotina saudável</h4>
                    </div>
                    <div class="progress">
                        <i class="fa-solid fa-arrow-trend-up" id="chart"></i>
                        <h4>Meu progresso</h4>
                    </div>
                </div>

            </div>
            </main>

            <footer>
                <div class="bar">
                    <a href="home.html" type="button">
                        <i class="fa-solid fa-house-chimney" id="house"></i>
                    </a>
                    <a href="#" type="button">
                        <i class="fa-solid fa-seedling" id="plant2"></i>
                    </a>
                    <a href="#" type="button">
                         <i class="fa-regular fa-calendar-days" id="calendar2"></i>
                    </a>
                    <a href="#" type="button">
                        <i class="fa-regular fa-user" id="peaple2"></i>
                    </a>
                    <div class="topics">
                         <p class="names" id="then">Inicio</p>
                         <p class="names">Rotina</p>
                         <p class="names">Agenda</p>
                         <p class="names">Perfil</p>
                    </div>

                </div>
            </footer>
    </div>
</body>
</html>
