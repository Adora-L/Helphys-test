<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <link rel="stylesheet" href="wing-file/CSS/style2.css">
    <script src="https://kit.fontawesome.com/8c2b73c7be.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="text">
                <h1>Olá!</h1>
                <p>Aqui você encontra tudo o que você precisa para cuidar da sua mente e do seu bem-estar.</p>
            </div>
            </header>
            <main>
                <div class="column-one">
                    <div class="atendimento">
                        <i class="fa-solid fa-brain" id="brain"></i>
                        <h2>Atendimento psicológico</h2>
                        <p>Online ou presencial</p>
                    </div>

                    <div class="rotina">
                        <i class="fa-solid fa-seedling" id="plant"></i>
                        <h2>Rotina saudável</h2>
                        <p>Pequenos hábitos, grandes mudanças</p>
                    </div>
                </div>
                <div class="column-two">
                    <div class="agende">
                        <i class="fa-regular fa-calendar-days" id="calendar"></i>
                        <h2>Agende sua consulta</h2>
                        <p>Rápido e fácil</p>
                    </div>
                    
                    <div class="acompanhe">
                        <i class="fa-solid fa-arrow-trend-up" id="chart"></i>
                        <h2>Acompanhe seu progresso</h2>
                        <p>Evolua no seu tempo</p>
                    </div>
                </div>
                <a href="home.html" type="button" class="button">Vamos começar</a>
                <div></div>
            </main>
    </div>
</body>
</html>
